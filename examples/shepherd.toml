# Shepherd: Go/Mongo shepherd-api -> C#/Postgres shepherd-api-dotnet.
# Field paths come from Go's bson tags in shepherd-api/pkg/models.

schema = "shepherd"
id_suffix = "53484550"   # "SHEP", same as Ids/ObjectIdGuid.cs in shepherd-api-dotnet
go_zero_values = true

# C# seeds the four org roles with fixed placeholder ids, and OrgRoles.Name is unique, so they
# collide with Go's roles. C# looks roles up by name, so the seeded rows can go. Fresh database
# only: this fails if users already reference the seeded roles.
before = [
  """delete from shepherd."OrgRoles" where "Id" in (
       '00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002',
       '00000000-0000-0000-0000-000000000003', '00000000-0000-0000-0000-000000000004')""",
]

# ASP.NET Identity columns lift can't derive from Go's documents. Forgot-password looks users up
# by NormalizedEmail, and reset tokens need a SecurityStamp. Postgres upper() matches .NET's
# ToUpperInvariant for ASCII.
after = [
  """update shepherd."Users" set
       "NormalizedEmail" = coalesce("NormalizedEmail", upper("Email")),
       "NormalizedUserName" = coalesce("NormalizedUserName", upper("UserName")),
       "SecurityStamp" = coalesce("SecurityStamp", upper(replace(gen_random_uuid()::text, '-', ''))),
       "ConcurrencyStamp" = coalesce("ConcurrencyStamp", gen_random_uuid()::text)""",
]

