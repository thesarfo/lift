# C# seeds the same four roles with fixed ids (OrgRoleConfiguration) and OrgRoles.Name is unique,
# so the seeded rows have to go before `lift run` or these collide. C# finds roles by name.
[table.columns]
Id = "_id"
Name = "name"
MainAdmin = "main_admin"

[[table]]
collection = "users"
table = "Users"
# ASP.NET Identity. NormalizedUserName, NormalizedEmail, SecurityStamp and ConcurrencyStamp
# can't come from a path: fill them with SQL after the load (see the parts report).
# FirstName/LastName/Phone are the mobile OTP user's fields; org users use FullName/PhoneNumber.
[table.columns]
Id = "_id"                       # text column: ObjectId hex, same as Zones/Communities.AssignedFieldProviderId
FullName = "full_name"
Email = "email"
UserName = "email"               # C# sets UserName = Email for org users; Go's username is mostly ""
EmailConfirmed = { value = true } # C# sets it on every org user it creates
PasswordHash = "password"        # Go's bcrypt. C#'s default hasher throws on it: needs a bcrypt-aware IPasswordHasher
PhoneNumber = "phone_number"
TwoFactorEnabled = "two_factor_enabled"
Status = "status"
Code = "code"
Address = "address"
Qualifications = "qualifications"
LicenseExpiry = "license_expiry"
Permission = "permission"
OrganizationId = "organization_id"
RoleId = "role_id"
RegionId = "region_id"
DistrictId = "district_id"
ZoneId = "zone_id"
CreatedAt = "meta.created_at"
UpdatedAt = "meta.updated_at"

